services:
  db:
    image: postgres:16-alpine
    container_name: carekan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carekan
      POSTGRES_PASSWORD: carekan
      POSTGRES_DB: carekan
    ports:
      - "5432:5432"
    volumes:
      - carekan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carekan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carekan_pgdata:
