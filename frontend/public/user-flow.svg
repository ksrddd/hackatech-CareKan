<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980"
     font-family="Sarabun, 'Noto Sans Thai', system-ui, sans-serif"
     role="img" aria-label="CareKan user flow diagram">
  <title>CareKan — User Flow</title>
  <desc>เส้นทางการใช้งานครบทุกหน้า: Public → Citizen / Admin พร้อม data sync ระหว่างสองฝั่ง</desc>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b4d8c"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#143b6e"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a4a00"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f5e22"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="980" fill="#f3f4f6"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#14213d"/>
  <rect x="0" y="68" width="1200" height="4" fill="#f9c80e"/>
  <text x="600" y="32" text-anchor="middle" fill="#ffffff"
        font-size="22" font-weight="700">CareKan — User Flow</text>
  <text x="600" y="55" text-anchor="middle" fill="#f9c80e" font-size="13">
    แคร์กัน · ระบบนัดหมายโรงพยาบาลรัฐ กรุงเทพมหานคร · ทีมเจ็ดจริงดิ!
  </text>

  <!-- ============================ PUBLIC LANE ============================ -->
  <rect x="40" y="95" width="1120" height="170" rx="4"
        fill="#ffffff" stroke="#c8ccd2" stroke-width="1.5"/>
  <rect x="40" y="95" width="160" height="170" fill="#14213d"/>
  <text x="120" y="135" text-anchor="middle" fill="#f9c80e"
        font-size="14" font-weight="700">PUBLIC</text>
  <text x="120" y="158" text-anchor="middle" fill="#ffffff" font-size="11">ไม่ต้อง login</text>
  <text x="120" y="175" text-anchor="middle" fill="#ffffff" font-size="11">เข้าได้ทุกคน</text>
  <text x="120" y="200" text-anchor="middle" fill="#c8ccd2" font-size="10">
    Landing / Login / Register
  </text>
  <text x="120" y="218" text-anchor="middle" fill="#c8ccd2" font-size="10">
    Search / Hospital
  </text>

  <!-- Landing card -->
  <g transform="translate(220, 115)">
    <rect width="270" height="130" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#14213d">/  Landing</text>
    <text x="20" y="52" font-size="11" fill="#475569">Hero · Value props</text>
    <text x="20" y="70" font-size="11" fill="#475569">How it works (4 ขั้น)</text>
    <text x="20" y="88" font-size="11" fill="#475569">9 รพ. ในเครือ กทม.</text>
    <text x="20" y="106" font-size="11" fill="#475569">CTA → /register หรือ /login</text>
    <text x="20" y="122" font-size="10" fill="#1b4d8c" font-weight="700">→ /search · /hospitals/:id</text>
  </g>

  <!-- Login card -->
  <g transform="translate(520, 115)">
    <rect width="270" height="130" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#14213d">/login</text>
    <text x="20" y="52" font-size="11" fill="#475569">เลข ปชช. 13 หลัก + รหัสผ่าน</text>
    <text x="20" y="70" font-size="11" fill="#475569">useRequest pattern</text>
    <text x="20" y="88" font-size="11" fill="#475569">submitting · error · success (DU)</text>
    <text x="20" y="106" font-size="11" fill="#475569">role detect → redirect ถูกหน้า</text>
    <text x="20" y="122" font-size="10" fill="#1b4d8c" font-weight="700">disable submit + role="alert" error</text>
  </g>

  <!-- Register card -->
  <g transform="translate(820, 115)">
    <rect width="320" height="130" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#14213d">/register · 4 steps</text>
    <text x="20" y="52" font-size="11" fill="#475569">① PDPA consent (checkbox + บันทึก consentAt)</text>
    <text x="20" y="70" font-size="11" fill="#475569">② ชื่อ-นามสกุล · เลข ปชช. · วันเกิด · เพศ</text>
    <text x="20" y="88" font-size="11" fill="#475569">③ เบอร์โทร · อีเมล</text>
    <text x="20" y="106" font-size="11" fill="#475569">④ ตั้งรหัสผ่าน + ยืนยัน</text>
    <text x="20" y="122" font-size="10" fill="#1b4d8c" font-weight="700">→ /login (กับ state.registeredCid)</text>
  </g>

  <!-- arrows in public -->
  <path d="M 490 180 L 518 180" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>
  <path d="M 790 168 L 818 168" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>
  <path d="M 820 195 L 792 195" stroke="#1b4d8c" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arr-blue)" fill="none"/>

  <!-- ============================ Role split ============================ -->
  <line x1="655" y1="265" x2="655" y2="298" stroke="#14213d" stroke-width="2"/>
  <text x="665" y="285" font-size="11" font-weight="700" fill="#14213d">login success</text>

  <path d="M 655 298 Q 655 320, 540 330 L 340 348"
        stroke="#1b4d8c" stroke-width="2.5"
        marker-end="url(#arr-blue)" fill="none"/>
  <text x="395" y="312" font-size="11" font-weight="700" fill="#1b4d8c">
    role: citizen → /my-appointments
  </text>

  <path d="M 655 298 Q 655 320, 770 330 L 920 348"
        stroke="#143b6e" stroke-width="2.5"
        marker-end="url(#arr-dark)" fill="none"/>
  <text x="780" y="312" font-size="11" font-weight="700" fill="#143b6e">
    role: admin → /admin
  </text>

  <!-- ============================ CITIZEN LANE ============================ -->
  <rect x="40" y="350" width="600" height="560" rx="4"
        fill="#e7eef7" stroke="#1b4d8c" stroke-width="1.5"/>
  <rect x="40" y="350" width="600" height="36" fill="#1b4d8c"/>
  <text x="56" y="373" fill="#ffffff" font-size="14" font-weight="700">CITIZEN FLOW</text>
  <text x="240" y="373" fill="#cdd9eb" font-size="11">
    ProtectedRoute role="citizen" · getBooking ต้องตรวจ ownership
  </text>

  <!-- 1. My Appointments -->
  <g transform="translate(60, 400)">
    <rect width="560" height="58" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700">① /my-appointments</text>
    <text x="20" y="44" font-size="11" fill="#475569">
      นัดที่จะมาถึง + ประวัติ + sidebar ข้อมูลสิทธิ์ · empty state "เริ่มจองคิวเลย"
    </text>
  </g>
  <line x1="340" y1="458" x2="340" y2="475" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>

  <!-- 2. Search Hospitals -->
  <g transform="translate(60, 475)">
    <rect width="560" height="58" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700">② /search</text>
    <text x="20" y="44" font-size="11" fill="#475569">
      9 รพ. · filter เขต/บริการ/สิทธิ์ · sort ระยะทาง · เรียลไทม์ (mock) คิวว่าง
    </text>
  </g>
  <line x1="340" y1="533" x2="340" y2="550" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>

  <!-- 3. Hospital Detail -->
  <g transform="translate(60, 550)">
    <rect width="560" height="58" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700">③ /hospitals/:id</text>
    <text x="20" y="44" font-size="11" fill="#475569">
      ที่อยู่ · เวลาเปิด · บริการ · คลินิก · สิทธิ์รองรับ → ปุ่ม "จองคิว"
    </text>
  </g>
  <line x1="340" y1="608" x2="340" y2="625" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>

  <!-- 4. Book Wizard (taller) -->
  <g transform="translate(60, 625)">
    <rect width="560" height="98" rx="4" fill="#fff4d6"
          stroke="#7a4a00" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700">④ /book · 3-step wizard</text>
    <text x="20" y="44" font-size="11" fill="#7a4a00">
      ① เลือกโรงพยาบาล + คลินิก + วัตถุประสงค์ + อาการ (ไม่บังคับ ≤200 char)
    </text>
    <text x="20" y="62" font-size="11" fill="#7a4a00">
      ② เลือกวันที่ (ปฏิทินไทย พ.ศ. ดูคิวว่าง) + ช่วงเวลา (slot 30 นาที · cap 6)
    </text>
    <text x="20" y="80" font-size="11" fill="#7a4a00">
      ③ ตรวจสอบ → ยืนยัน → createBooking() · ออก bookingRef + queueNumber
    </text>
  </g>
  <line x1="340" y1="723" x2="340" y2="740" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>

  <!-- 5. Success + QR -->
  <g transform="translate(60, 740)">
    <rect width="560" height="58" rx="4" fill="#e3f1e1"
          stroke="#1f5e22" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1f5e22">
      ⑤ /book/success/:id
    </text>
    <text x="20" y="44" font-size="11" fill="#1f5e22">
      QR + booking ref + queue number + checklist เตรียมตัว
    </text>
  </g>
  <line x1="340" y1="798" x2="340" y2="815" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)" fill="none"/>

  <!-- 6. Appointment Detail -->
  <g transform="translate(60, 815)">
    <rect width="560" height="78" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700">
      ⑥ /appointments/:id · live queue (poll 5 วินาที)
    </text>
    <text x="20" y="42" font-size="11" fill="#475569">
      คิวปัจจุบัน · รอก่อนคุณ · หมายเลขคุณ · QR + checklist + ข้อมูลติดต่อ รพ.
    </text>
    <text x="20" y="62" font-size="11" fill="#475569">
      🛡 ownership check: getBooking(id, { requireOwnerUserId: user.id }) — PDPA
    </text>
  </g>

  <!-- ============================ ADMIN LANE ============================ -->
  <rect x="680" y="350" width="480" height="560" rx="4"
        fill="#14213d" stroke="#143b6e" stroke-width="1.5"/>
  <rect x="680" y="350" width="480" height="36" fill="#143b6e"/>
  <text x="696" y="373" fill="#f9c80e" font-size="14" font-weight="700">ADMIN FLOW</text>
  <text x="860" y="373" fill="#cdd9eb" font-size="11">
    ProtectedRoute role="admin"
  </text>

  <!-- 1. Admin Dashboard -->
  <g transform="translate(700, 400)">
    <rect width="440" height="138" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700">① /admin · Dashboard</text>
    <text x="20" y="50" font-size="11" fill="#475569">KPI 6 ตัว: นัดวันนี้ · check-in · กำลังตรวจ ·</text>
    <text x="20" y="68" font-size="11" fill="#475569">เสร็จ · ไม่มา · % utilization</text>
    <text x="20" y="86" font-size="11" fill="#475569">📊 กราฟ booked/ชม · 🕘 recent bookings (poll 5s)</text>
    <text x="20" y="104" font-size="11" fill="#475569">⚠ sidebar: ยังไม่ Check-in (อ่าน → กดไป Queue)</text>
    <text x="20" y="122" font-size="11" fill="#475569">🏥 ห้องตรวจสถานะ (in_use / available / closed)</text>
  </g>
  <line x1="900" y1="538" x2="900" y2="570" stroke="#143b6e" stroke-width="2"
        marker-end="url(#arr-dark)" fill="none"/>

  <!-- 2. Queue View -->
  <g transform="translate(700, 570)">
    <rect width="440" height="320" rx="4" fill="#ffffff"
          stroke="#1b4d8c" stroke-width="2"/>
    <text x="20" y="26" font-size="13" font-weight="700">② /admin/queue · Queue Management</text>
    <text x="20" y="50" font-size="11" fill="#475569">📋 card คิวที่กำลังเรียก · KPI 4 ตัว (นัด · เช็กอิน · รอเรียก · เสร็จ)</text>
    <text x="20" y="68" font-size="11" fill="#475569">🔍 filter (รอเช็กอิน+รอเรียก / ทั้งหมด / เช็กอินแล้ว / เสร็จ)</text>
    <text x="20" y="86" font-size="11" fill="#475569">🔎 search ชื่อ / เลขจอง / เลขคิว</text>
    <text x="20" y="108" font-size="11" fill="#475569">ตารางคิว: คิว · นัด · เช็กอิน · ผู้รับ · อายุ · สาเหตุ · สถานะ · action</text>

    <line x1="0" y1="120" x2="440" y2="120" stroke="#c8ccd2" stroke-width="1"/>

    <text x="20" y="142" font-size="13" font-weight="700" fill="#143b6e">Actions (state machine):</text>

    <g transform="translate(20, 156)">
      <rect width="98" height="22" rx="2" fill="#e7eef7" stroke="#143b6e"/>
      <text x="49" y="16" text-anchor="middle" font-size="11" fill="#14213d">confirmed</text>
    </g>
    <line x1="120" y1="167" x2="135" y2="167" stroke="#1f5e22" stroke-width="2"
          marker-end="url(#arr-ok)"/>
    <g transform="translate(140, 156)">
      <rect width="98" height="22" rx="2" fill="#fff4d6" stroke="#7a4a00"/>
      <text x="49" y="16" text-anchor="middle" font-size="11" fill="#7a4a00">checked_in</text>
    </g>
    <line x1="240" y1="167" x2="255" y2="167" stroke="#1f5e22" stroke-width="2"
          marker-end="url(#arr-ok)"/>
    <g transform="translate(260, 156)">
      <rect width="98" height="22" rx="2" fill="#e7eef7" stroke="#143b6e"/>
      <text x="49" y="16" text-anchor="middle" font-size="11" fill="#14213d">in_progress</text>
    </g>
    <line x1="360" y1="167" x2="375" y2="167" stroke="#1f5e22" stroke-width="2"
          marker-end="url(#arr-ok)"/>
    <g transform="translate(380, 156)">
      <rect width="50" height="22" rx="2" fill="#e3f1e1" stroke="#1f5e22"/>
      <text x="25" y="16" text-anchor="middle" font-size="11" fill="#1f5e22">done</text>
    </g>

    <text x="20" y="208" font-size="11" fill="#475569">
      ปุ่มในแถว: "เรียกคิวถัดไป" · "เรียก" · "เสร็จสิ้น" · "ไม่มา"
    </text>
    <text x="20" y="226" font-size="11" fill="#475569">
      ทุก action → bookingsStore.updateStatus(id, status)
    </text>
    <text x="20" y="244" font-size="11" fill="#475569">
      → เก็บใน localStorage carekan.statusOverrides
    </text>
    <text x="20" y="262" font-size="11" fill="#475569">
      → poll 5s ของผู้ป่วยฝั่งซ้ายเห็นทันที
    </text>
    <text x="20" y="288" font-size="11" fill="#1b4d8c" font-weight="700">
      ⚙ Mock: localStorage shared ระหว่าง tab เดียวกัน
    </text>
    <text x="20" y="306" font-size="11" fill="#1b4d8c" font-weight="700">
      Backend: SSE / WebSocket / poll API จริง
    </text>
  </g>

  <!-- ===== Cross-lane sync arrows ===== -->
  <!-- citizen book confirm → admin queue (booking appears) -->
  <path d="M 624 670 C 660 670, 660 470, 696 470"
        stroke="#7a4a00" stroke-width="2.5"
        marker-end="url(#arr-gold)" fill="none"/>
  <g transform="translate(626, 562)">
    <rect width="68" height="36" rx="4" fill="#fff4d6"
          stroke="#7a4a00" stroke-width="1.5"/>
    <text x="34" y="14" text-anchor="middle" font-size="10"
          font-weight="700" fill="#7a4a00">①  booking</text>
    <text x="34" y="28" text-anchor="middle" font-size="10"
          fill="#7a4a00">→ admin</text>
  </g>

  <!-- admin status update → citizen detail (5s poll) -->
  <path d="M 696 820 C 660 820, 660 855, 624 855"
        stroke="#7a4a00" stroke-width="2.5" stroke-dasharray="6 4"
        marker-end="url(#arr-gold)" fill="none"/>
  <g transform="translate(626, 830)">
    <rect width="68" height="36" rx="4" fill="#fff4d6"
          stroke="#7a4a00" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="34" y="14" text-anchor="middle" font-size="10"
          font-weight="700" fill="#7a4a00">②  status</text>
    <text x="34" y="28" text-anchor="middle" font-size="10"
          fill="#7a4a00">→ citizen</text>
  </g>

  <!-- ============================ Legend ============================ -->
  <rect x="40" y="925" width="1120" height="40" rx="4"
        fill="#ffffff" stroke="#c8ccd2" stroke-width="1"/>

  <text x="55" y="950" font-size="11" font-weight="700" fill="#14213d">Legend:</text>

  <line x1="120" y1="946" x2="160" y2="946" stroke="#1b4d8c" stroke-width="2"
        marker-end="url(#arr-blue)"/>
  <text x="168" y="950" font-size="11" fill="#475569">citizen navigation</text>

  <line x1="290" y1="946" x2="330" y2="946" stroke="#143b6e" stroke-width="2"
        marker-end="url(#arr-dark)"/>
  <text x="338" y="950" font-size="11" fill="#475569">admin navigation</text>

  <line x1="450" y1="946" x2="490" y2="946" stroke="#7a4a00" stroke-width="2"
        marker-end="url(#arr-gold)"/>
  <text x="498" y="950" font-size="11" fill="#475569">data sync (mock localStorage · poll 5s)</text>

  <line x1="730" y1="946" x2="770" y2="946" stroke="#1b4d8c" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="778" y="950" font-size="11" fill="#475569">optional / back path</text>

  <line x1="920" y1="946" x2="960" y2="946" stroke="#1f5e22" stroke-width="2"
        marker-end="url(#arr-ok)"/>
  <text x="968" y="950" font-size="11" fill="#475569">status state transition</text>

</svg>
